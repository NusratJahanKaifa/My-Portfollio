<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #dbeafe,
                #ede9fe,
                #fce7f3
            );
            padding: 20px;
        }
        /* Main Card */
        .container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            padding: 30px;
            border: 2px solid #c7d2fe;
            border-radius: 22px;
            box-shadow:
                0 15px 35px rgba(79, 70, 229, 0.18);
        }
        /* Heading */
        .title {
            text-align: center;
            margin-bottom: 25px;
        }
        .title h1 {
            font-size: 38px;
            color: #312e81;
            margin-bottom: 8px;
        }
        .title p {
            font-size: 15px;
            color: #6b7280;
        }
        /* Input Area */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid #c7d2fe;
            border-radius: 12px;
            outline: none;
            color: #374151;
            background: #f8fafc;
        }
        .input-area input:focus {
            border-color: #6366f1;
            background: white;
            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.12);
        }
        /* Add Task Button */
        .add-btn {
            padding: 14px 20px;
            border: 2px solid #4338ca;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .add-btn:hover {
            background: #3730a3;
            border-color: #312e81;
            transform: translateY(-2px);
            box-shadow:
                0 6px 12px rgba(79, 70, 229, 0.25);
        }
        /* Task Box */
        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 13px;
            transition: 0.3s;
        }
        .task:hover {
            border-color: #a5b4fc;
            background: #eef2ff;
            box-shadow:
                0 5px 12px rgba(99, 102, 241, 0.12);
        }
        /* Task Left */
        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* Checkbox */
        .task-left input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4f46e5;
        }
        /* Task Name */
        .task-name {
            font-size: 17px;
            font-weight: bold;
            color: #374151;
        }
        /* Date */
        .task-date {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 5px;
        }
        /* Delete Button */
        .delete-btn {
            padding: 8px 12px;
            border: 2px solid #fecaca;
            border-radius: 9px;
            background: #fff1f2;
            color: #dc2626;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .delete-btn:hover {
            background: #dc2626;
            border-color: #b91c1c;
            color: white;
        }
        /* Completed Task */
        .completed {
            text-decoration: line-through;
            color: #9ca3af;
        }
        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #e5e7eb;
            color: #6b7280;
            font-size: 14px;
        }
        .count {
            color: #4f46e5;
            font-weight: bold;
        }
        /* Mobile */
        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }
            .title h1 {
                font-size: 30px;
            }
            .input-area {
                flex-direction: column;
            }
            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Heading -->
    <div class="title">
        <h1>Task Manager</h1>
        <p>Manage your daily tasks easily</p>
    </div>
    <!-- Add Task -->
    <div class="input-area">
        <input id="taskInput" type="text" placeholder="Enter your task...">
        <button class="add-btn"onclick="addTask()"> Add Task </button>
    </div>
    <!-- Task List -->
    <div id="taskList"></div>
    <!-- Footer -->
    <div class="footer">
        <span>Total Tasks</span>
        <span id="taskCount" class="count">0 </span>
    </div>
</div>
<script>
    // Get saved tasks
    let tasks = JSON.parse(localStorage.getItem("tasks") ) || [];
    // Add Task
    function addTask() {
        let input = document.getElementById("taskInput");
        let text = input.value.trim();
        if (text === "") {
            alert("Please enter a task!");
            return;
        }
        let task = {
            id: Date.now(),
            text: text,
            completed: false,
            date: new Date().toLocaleDateString(
                "en-GB",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            )
        };
        tasks.push(task);
        saveTasks();
        input.value = "";
        displayTasks();
    }
// Save Tasks
function saveTasks() {
    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );
}
// Display Tasks
function displayTasks() {
    let taskList = document.getElementById("taskList");
    taskList.innerHTML = "";
    tasks.forEach(function(task) {
        let div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `
            <div class="task-left">
                <input type="checkbox" ${task.completed ? "checked" : ""} onchange="completeTask(${task.id})">
                <div>
                <div class="task-name${task.completed ? "completed" : ""}">
                    ${task.text}
                </div>
                    <div class="task-date">
                        ${task.date}
                    </div>
                </div>
            </div>
            <button class="delete-btn" onclick="deleteTask(${task.id})">
                Delete
            </button>
        `;
        taskList.appendChild(div);
    });
    document.getElementById(
        "taskCount"
    ).innerText = tasks.length;
}
// Complete Task
function completeTask(id) {
    tasks.forEach(function(task) {
        if (task.id === id) {
            task.completed =
                !task.completed;
        }
    });
    saveTasks();
    displayTasks();
}
// Delete Task
function deleteTask(id) {
    tasks = tasks.filter(function(task) {
        return task.id !== id;
        });
    saveTasks();
    displayTasks();
}
// Enter Key
document.getElementById(
    "taskInput"
).addEventListener(
    "keypress",
    function(event) {
        if (event.key === "Enter") {
            addTask();
        }
    }
);
// Initial Display
displayTasks();
</script>
</body>
</html>
