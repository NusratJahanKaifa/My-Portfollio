<!DOCTYPE html>
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link href="output.css" rel="stylesheet">
</head>
<body class="bg-amber-100 flex justify-center items-center min-h-screen">
<div class="bg-white p-6 rounded-lg shadow-lg w-80 text-center">
    <h1 class="font-bold text-3xl ">Calculator</h1>
    <div id="show" class="font-bold text-2xl border p-2 rounded mb-4">0</div>
    <input type="number" id="num1" placeholder="First number" class="w-full border p-2 mb-2 rounded">
    <input type="number" id="num2" placeholder="Second number"class="w-full border p-2 mb-3 rounded">
    <div class="grid grid-cols-2 gap-2">
        <button onclick="sum()" class="bg-amber-500 text-white py-2 rounded">+</button>
        <button onclick="div()" class="bg-blue-500 text-white py-2 rounded">/</button>
        <button onclick="sub()" class="bg-green-500 text-white py-2 rounded">-</button>
        <button onclick="multi()" class="bg-teal-600 text-white py-2 rounded">*</button>
       
        <button id="reset" onclick="Reset()" class="bg-black  text-white py-2 rounded">Reset</button>
    </div>
</div>
<script>
function sum(){
    let num1 = parseInt(document.getElementById("num1").value); 
    let num2 = parseInt(document.getElementById("num2").value);  
    let show = document.getElementById("show");
    show.innerHTML = (num1 + num2)
}
function div(){
    let num1 = parseFloat(document.getElementById("num1").value); 
    let num2 = parseFloat(document.getElementById("num2").value); 
    let show = document.getElementById("show");
    show.innerHTML = (num1 / num2)
    }
function sub(){
    let num1 = parseInt(document.getElementById("num1").value); 
    let num2 = parseInt(document.getElementById("num2").value); 
    let show = document.getElementById("show");
    show.innerHTML = (num1 - num2)
}
function multi(){
    let num1 = parseInt(document.getElementById("num1").value); 
    let num2 = parseInt(document.getElementById("num2").value); 
    let show = document.getElementById("show");
    show.innerHTML = (num1 * num2)
}
function Reset(){
    let show = document.getElementById('show')
    show.innerHTML = 0
    let num1 = document.getElementById('num1')
    num1.value = ''
    let num2 = document.getElementById('num2')
    num2.value = ''
}
</script>
</body>
</html>
